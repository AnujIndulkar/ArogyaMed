server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # document uploads are limited to 10MB

    # Docker's internal DNS, so nginx still starts if the backend is not up yet
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # API and uploaded files go to the Spring Boot container
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # React Router: every other URL returns index.html
    location / {
        try_files $uri /index.html;
    }
}