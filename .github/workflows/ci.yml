name: ArogyaMed CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend - test and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arogyamed_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run all tests
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/arogyamed_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters
          APP_OTP_SECRET: ci-only-otp-secret-that-is-at-least-32-characters
          APP_MAIL_FROM: ci@example.com

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: arogyamed-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: arogyamed-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker:
    name: Docker - full stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from the example file
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to answer through the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/medicines > /dev/null; then
              echo "API is up after $((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "API did not come up in time"
          exit 1

      - name: Check the website itself
        run: curl -fsS http://localhost:3000/ | grep -qi "<div id=\"root\""

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v