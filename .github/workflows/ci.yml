name: ArogyaMed CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: ./mvnw -B test

      - name: Build application
        run: ./mvnw -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t arogyamed-backend:latest .